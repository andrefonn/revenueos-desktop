[package]
name = "revenue-os-desktop"
version = "0.1.1"
description = "Revenue OS para Windows"
authors = ["Revenue OS"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"
url = "2"
open = "5"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"

